name: Build and Deploy

on:
  push:
    branches: [main]

# Two merges a minute apart used to run two deploys at once, and the older
# build could finish last and go live. The newest push wins now.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  SERVICE_NAME: job-outreach-svc
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Deploy to Kubernetes
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          # PRESTOP_DRAIN (audit AR-B01): the pod kept serving for a few seconds after
          # SIGTERM while ingress-nginx still routed to it, so every rollout
          # answered a burst of 502s to live users. Sleep before shutdown so
          # the endpoint is removed first. Native sleep action (k8s >= 1.30),
          # so it needs no shell in the image.
          kubectl patch deployment/${{ env.SERVICE_NAME }} -n studojo --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"${{ env.SERVICE_NAME }}","lifecycle":{"preStop":{"sleep":{"seconds":10}}}}]}}}}'
          kubectl set image deployment/${{ env.SERVICE_NAME }} ${{ env.SERVICE_NAME }}=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} -n studojo
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            AZURE_OPENAI_LLM_DEPLOYMENT=gpt-5-mini \
            AZURE_OPENAI_FAST_DEPLOYMENT=gpt-4o-mini \
            AZURE_OPENAI_EMAIL_DEPLOYMENT=gpt-4o \
            AZURE_OPENAI_API_VERSION=2025-04-01-preview \
            AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-3-small \
            -n studojo
          # Wire the residential proxy (LinkedIn discovery + sending) from app-secrets.
          kubectl set env deployment/${{ env.SERVICE_NAME }} -n studojo \
            --from=secret/app-secrets --keys=linkedin-proxy-url
          # Secrets reach the pod only as secretKeyRef, never as literal values in
          # the Deployment spec (audit ST-N07). scripts/ci/secret_env.sh explains.
          # Meta Conversions API token: the GitHub secret is stored in app-secrets
          # (an empty one changes nothing, so a working value is never blanked).
          # Keys set by hand on the Deployment are adopted into app-secrets once.
          export NS=studojo DEP=${{ env.SERVICE_NAME }}
          . scripts/ci/secret_env.sh
          secret_put   meta-capi-token "$META_CAPI_TOKEN"
          secret_adopt META_CAPI_TOKEN meta-capi-token
          secret_ref   POSTHOG_KEY POSTHOG_KEY
          secret_ref   RAZORPAY_KEY_SECRET razorpay-key-prod-secret
          secret_ref   LINKEDIN_ENCRYPTION_KEY linkedin-encryption-key
          secret_adopt DODO_PAYMENTS_API_KEY dodo-api-key
          secret_adopt DODO_WEBHOOK_SECRET dodo-webhook-secret
          # Service-to-service secret: X-User-Id is only trusted next to a matching
          # x-studojo-internal header. Read from the same app-secrets key the
          # frontend uses, so the two can never drift. Without it the header path is
          # off and the frontend's server-side CRM/extension calls get 401.
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            --from=secret/app-secrets --keys=INTERNAL_API_SECRET \
            -n studojo
          # Account deletion (Privacy Policy §15): resume files in Azure Blob and
          # the user's PostHog person. kubectl turns the keys into
          # AZURE_STORAGE_ACCOUNT_NAME, AZURE_STORAGE_ACCOUNT_KEY,
          # POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID.
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            --from=secret/app-secrets --keys=azure-storage-account-name,azure-storage-account-key,POSTHOG_PERSONAL_API_KEY,POSTHOG_PROJECT_ID \
            -n studojo
          # Razorpay webhook signature (UC-Q05). The same app-secrets key the
          # frontend's own Razorpay webhook uses; kubectl names it
          # RAZORPAY_WEBHOOK_SECRET. Without it the webhook refuses every call
          # and payments are confirmed only by the reconciler.
          if [ -n "$(kubectl get secret app-secrets -n studojo -o jsonpath='{.data.razorpay-webhook-secret}')" ]; then
            kubectl set env deployment/${{ env.SERVICE_NAME }} \
              --from=secret/app-secrets --keys=razorpay-webhook-secret \
              -n studojo
          fi
          # Emailer's send-template secret, for the paid-not-launched nudges
          # (services/launch_nudge.py). Only wired once the app-secrets key
          # exists; without it the nudges are off and nothing else changes.
          if [ -n "$(kubectl get secret app-secrets -n studojo -o jsonpath='{.data.emailer-internal-secret}')" ]; then
            kubectl set env deployment/${{ env.SERVICE_NAME }} \
              --from=secret/app-secrets --keys=emailer-internal-secret \
              -n studojo
          fi
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n studojo --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} -o wide
            LATEST_POD=$(kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n studojo --field-selector involvedObject.name=$LATEST_POD --sort-by='.lastTimestamp' | tail -20 || true
              kubectl logs -n studojo $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Apply ops CronJobs (k8s/ops-alerts)
        run: |
          # Keep the live CronJobs equal to the repo. They used to be applied by
          # hand only, so a fix could merge and never reach the cluster (the
          # Mesa daily scrape 401'd for days and never existed in prod, audit
          # IN-N07). These files contain no Secret objects: the alert webhook
          # secret is created by hand (see restart-alert.yaml), so applying
          # them cannot wipe it.
          for f in k8s/ops-alerts/*.yaml; do
            if grep -qE '^kind: Secret' "$f"; then
              echo "::error::$f contains a Secret; applying it would overwrite the live one"
              exit 1
            fi
          done
          kubectl apply -f k8s/ops-alerts/

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.SERVICE_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"
