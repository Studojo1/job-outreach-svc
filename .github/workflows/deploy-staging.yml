name: Build and Deploy (Staging)

on:
  push:
    branches: [staging]

# Two merges a minute apart used to run two deploys at once, and the older
# build could finish last and go live. The newest push wins now.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  SERVICE_NAME: job-outreach-svc
  IMAGE_TAG: staging-${{ github.sha }}
  NAMESPACE: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:staging-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:staging-buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Refuse to run staging against production data
        run: |
          # Staging has its own DB (studojo_staging) and RabbitMQ vhost (staging)
          # since 2026-09-26. Before that it shared production's, and the staging
          # emailer sent real emails to production users. Fail loudly if a
          # hand-edited secret ever points back at production.
          for k in database-url rabbitmq-url; do
            v=$(kubectl get secret app-secrets -n staging -o jsonpath="{.data.$k}" | base64 -d)
            case "$v" in
              *postgres.studojo.svc*|*rabbitmq.studojo.svc.cluster.local:5672|*rabbitmq.studojo.svc.cluster.local:5672/)
                echo "::error::staging app-secrets/$k points at PRODUCTION. Refusing to deploy."; exit 1;;
            esac
          done
          echo "staging secrets point at staging data"

      - name: Deploy to Kubernetes (staging)
        env:
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
          BOB_ACCESS_CODE: ${{ secrets.BOB_ACCESS_CODE }}
          LEADSFORGE_API_KEY: ${{ secrets.LEADSFORGE_API_KEY }}
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            AZURE_OPENAI_LLM_DEPLOYMENT=gpt-5-mini \
            AZURE_OPENAI_FAST_DEPLOYMENT=gpt-4o-mini \
            AZURE_OPENAI_EMAIL_DEPLOYMENT=gpt-4o \
            -n ${{ env.NAMESPACE }}
          # Bob (Mesa) secrets — only set when configured in GitHub secrets,
          # so an empty secret never wipes a value already on the deployment.
          # Meta Conversions API is OFF on staging. The token is the live one,
          # so staging test orders were landing in the production ad dataset
          # (audit ST-N07). Remove it if an earlier deploy set it.
          kubectl set env deployment/${{ env.SERVICE_NAME }} META_CAPI_TOKEN- -n staging || true
          # Service-to-service secret: X-User-Id is only trusted next to a matching
          # x-studojo-internal header. Read from the same app-secrets key the
          # frontend uses, so the two can never drift. Without it the header path is
          # off and the frontend's server-side CRM/extension calls get 401.
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            --from=secret/app-secrets --keys=INTERNAL_API_SECRET \
            -n ${{ env.NAMESPACE }}
          # Account deletion (Privacy Policy §15): resume files in Azure Blob and
          # the user's PostHog person. kubectl turns the keys into
          # AZURE_STORAGE_ACCOUNT_NAME, AZURE_STORAGE_ACCOUNT_KEY,
          # POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID.
          kubectl set env deployment/${{ env.SERVICE_NAME }} \
            --from=secret/app-secrets --keys=azure-storage-account-name,azure-storage-account-key,POSTHOG_PERSONAL_API_KEY,POSTHOG_PROJECT_ID \
            -n ${{ env.NAMESPACE }}
          # Razorpay webhook signature (UC-Q05). The same app-secrets key the
          # frontend's own Razorpay webhook uses; kubectl names it
          # RAZORPAY_WEBHOOK_SECRET. Without it the webhook refuses every call
          # and payments are confirmed only by the reconciler.
          if [ -n "$(kubectl get secret app-secrets -n staging -o jsonpath='{.data.razorpay-webhook-secret}')" ]; then
            kubectl set env deployment/${{ env.SERVICE_NAME }} \
              --from=secret/app-secrets --keys=razorpay-webhook-secret \
              -n staging
          fi
          # Emailer's send-template secret, for the paid-not-launched nudges
          # (services/launch_nudge.py). Only wired once the app-secrets key
          # exists; without it the nudges are off and nothing else changes.
          if [ -n "$(kubectl get secret app-secrets -n ${{ env.NAMESPACE }} -o jsonpath='{.data.emailer-internal-secret}')" ]; then
            kubectl set env deployment/${{ env.SERVICE_NAME }} \
              --from=secret/app-secrets --keys=emailer-internal-secret \
              -n ${{ env.NAMESPACE }}
          fi
          # Secrets reach the pod only as secretKeyRef, never as literal values in
          # the Deployment spec (audit ST-N07). GitHub secrets are stored in
          # app-secrets first; an empty one changes nothing.
          export NS=${{ env.NAMESPACE }} DEP=${{ env.SERVICE_NAME }}
          . scripts/ci/secret_env.sh
          secret_put   context-dev-api-key "$CONTEXT_DEV_API_KEY"
          secret_put   bob-access-code "$BOB_ACCESS_CODE"
          secret_put   leadsforge-api-key "$LEADSFORGE_API_KEY"
          secret_adopt CONTEXT_DEV_API_KEY context-dev-api-key
          secret_adopt BOB_ACCESS_CODE bob-access-code
          secret_adopt LEADSFORGE_API_KEY leadsforge-api-key
          # Staging must never hold the live Meta token (the step above removes
          # it too); fail the deploy if a hand edit brings it back.
          if kubectl -n $NS get deployment/$DEP -o jsonpath='{.spec.template.spec.containers[0].env[*].name}' | tr ' ' '\n' | grep -qx META_CAPI_TOKEN; then
            echo "::error::META_CAPI_TOKEN is set on the staging deployment (ST-N07)"; exit 1
          fi
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }} -o wide
            LATEST_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} \
              -l app=${{ env.SERVICE_NAME }} \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n ${{ env.NAMESPACE }} \
                --field-selector involvedObject.name=$LATEST_POD \
                --sort-by='.lastTimestamp' | tail -20 || true
              kubectl logs -n ${{ env.NAMESPACE }} $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Apply staging Mesa daily-scrape CronJob
        run: |
          # Same manifest as prod, pointed at the staging namespace and service
          # (audit IN-N07: the staging cron drifted and ran without the internal
          # auth header, so every run 401'd).
          sed -e 's/namespace: studojo/namespace: staging/' \
              -e 's/job-outreach-svc\.studojo\.svc/job-outreach-svc.staging.svc/' \
              k8s/ops-alerts/mesa-daily-scrape.yaml | kubectl apply -f -
