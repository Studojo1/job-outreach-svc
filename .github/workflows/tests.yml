# Runs on every pull request and every push to main/staging. Required to pass
# before merging (branch protection). Exists because fixes were merging with
# no test run at all, and a regression was found weeks later by an audit.
name: Tests

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Dockerfile
          cache: pip
      - run: pip install -r requirements.txt pytest ruff==0.16.9
      # Lint was cleared to zero findings on 2026-09-28 (three real bugs among
      # them), so any new finding is a regression. Rules live in ruff.toml.
      - run: ruff check .
      - run: python -m pytest -q
