<!DOCTYPE html>
<html>
<head>

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 260px;
      padding: 20px;
      margin: 0;
      background: #fff;
      color: #1a1a2e;
    }
    .logo { font-weight: 700; font-size: 18px; margin-bottom: 6px; color: #7c3aed; }
    p { font-size: 13px; color: #555; line-height: 1.5; margin: 0 0 16px; }
    .status {
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f3f0ff;
      color: #7c3aed;
      border: 1px solid #e0d9ff;
    }
  </style>
</head>
<body>
  <div class="logo">studojo</div>
  <p>LinkedIn Connector — active on studojo.pro and studojo.com.</p>
  <div class="status" id="status">Checking LinkedIn login…</div>
  <script src="popup.js"></script>

</html>
