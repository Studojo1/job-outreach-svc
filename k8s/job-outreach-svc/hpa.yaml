apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: job-outreach-svc
  namespace: studojo
  labels:
    app: job-outreach-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: job-outreach-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Scale up aggressively when traffic spikes (campaign launches, etc.).
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
    # Scale down slowly so a momentary lull doesn't leave us thin right
    # before another spike.
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
